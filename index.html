<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Timezy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
/* Concept : app mobile d'abord. Barre du haut (rappels · heure · compte), contenu défilant, navigation basse.
   ≥1024px la navigation devient un rail latéral ; ≥820px l'accueil ajoute un panneau « à venir ». */
:root{
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#FAFAF9; --surface:#FFFFFF; --surface-2:#F0F2F1; --fg:#0F0F0F; --fg-2:#3C484B; --muted:#667275;
  --line:#E1E5E4; --brand:#1B4A53; --brand-ink:#1B4A53; --accent:#103138; --on-brand:#FAFAF9; --brand-soft:#DCEAED;
  --danger:#B3352B; --danger-soft:#F7E3E0; --ok:#2F7A4F; --now:#D9483B; --c-course:#B9C9CC; --shadow:0 8px 28px rgba(16,49,56,.14);
  --hh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0F0F; --surface:#171B1C; --surface-2:#1F2526; --fg:#FAFAF9; --fg-2:#C3CDCF; --muted:#8F9C9E;
  --line:#2A3235; --brand-ink:#86C1CE; --brand-soft:#17353B; --danger:#F08B80; --danger-soft:#3A1F1C; --ok:#7CC79A; --now:#F2685A; --c-course:#3B5157; --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F0F; --surface:#171B1C; --surface-2:#1F2526; --fg:#FAFAF9; --fg-2:#C3CDCF; --muted:#8F9C9E;
  --line:#2A3235; --brand-ink:#86C1CE; --brand-soft:#17353B; --danger:#F08B80; --danger-soft:#3A1F1C; --ok:#7CC79A; --now:#F2685A; --c-course:#3B5157; --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:400 15px/1.45 var(--font-body);background:var(--bg);color:var(--fg);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px}
svg{display:block}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.topbar .r{justify-self:end}
.clock{text-align:center;min-width:0}
.clock b{display:block;font:700 30px/1 var(--font-display);letter-spacing:-.02em;color:var(--brand-ink);font-variant-numeric:tabular-nums}
.clock span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--brand-ink);position:relative;flex:none}
.icon-btn:hover{background:var(--brand-soft)}
.badge{position:absolute;top:5px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--now);color:#fff;font:700 11px/18px var(--font-body);text-align:center}
.main-wrap{position:relative;min-height:0}
main{height:100%;overflow-y:auto;overscroll-behavior:contain}
.wrap{max-width:1120px;margin:0 auto;padding:16px 16px 96px}
.bottom{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 16px;border-top:1px solid var(--line);background:var(--bg)}
.nav-i{display:grid;justify-items:center;gap:2px;padding:4px 0;color:var(--muted);font-size:12px;font-weight:600}
.nav-i .pill{display:grid;place-items:center;padding:4px 20px;border-radius:16px;transition:background .15s}
.nav-i .ic{width:26px;height:26px}
.nav-i:hover{color:var(--fg)}
.nav-i[aria-current="page"]{color:var(--brand-ink)}
.nav-i[aria-current="page"] .pill{background:var(--brand-soft)}
@media(min-width:1024px){
  #app{grid-template-columns:96px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .topbar{grid-column:2;grid-row:1} .main-wrap{grid-column:2;grid-row:2}
  .bottom{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:16px 8px;border-top:0;border-right:1px solid var(--line)}
  .nav-i{padding:2px 0} .wrap{padding:24px 32px 48px} :root{--hh:72px}
}

h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
.h1{font-size:26px;line-height:1.1;letter-spacing:-.02em;color:var(--brand-ink);font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;background:var(--brand);color:var(--on-brand);font-weight:700;border:1px solid transparent}
.btn:hover{background:var(--accent)}
.btn .ic{width:20px;height:20px}
.btn.ghost{background:transparent;color:var(--brand-ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:12px}
.hide-s{display:none}
@media(min-width:700px){.hide-s{display:inline-flex}.fab{display:none!important}}
.fab{position:absolute;right:16px;bottom:16px;height:56px;padding:0 20px 0 16px;border-radius:18px;box-shadow:var(--shadow);z-index:5}

/* Accueil */
.strip{position:sticky;top:0;z-index:6;background:var(--bg);padding:4px 0 10px;display:flex;align-items:center;gap:4px;margin:0 -4px}
.strip .days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;min-width:0}
.dchip{display:grid;justify-items:center;gap:1px;padding:6px 0 7px;border-radius:14px;color:var(--fg-2);position:relative}
.dchip small{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dchip b{font:700 17px/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.dchip i{width:5px;height:5px;border-radius:50%;background:var(--brand-ink);opacity:.0}
.dchip.has i{opacity:.7}
.dchip:hover{background:var(--surface-2)}
.dchip.today b{color:var(--brand-ink)}
.dchip.today::after{content:"";position:absolute;inset:2px;border-radius:14px;border:1.5px solid var(--brand-ink);opacity:.5;pointer-events:none}
.dchip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.dchip[aria-pressed="true"] small{color:inherit;opacity:.8}.dchip[aria-pressed="true"] i{background:var(--on-brand)}
.today[aria-pressed="true"] b {color: var(--on-brand);}
.home-grid{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){.home-grid{grid-template-columns:minmax(0,1fr) 320px;align-items:start}.next-banner{display:none!important}}
@media(max-width:819px){.side{display:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--fg-2)}
.next-banner{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;background:var(--brand-soft);color:var(--brand-ink);margin-bottom:14px;font-weight:600;font-size:14px}
.next-banner span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next-banner .ic{width:20px;height:20px;flex:none}
.tl{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr)}
.tl-h{position:relative}
.tl-h span{position:absolute;right:8px;transform:translateY(-50%);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-g{position:relative;border-left:1px solid var(--line)}
.tl-l{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.8}
.ev{position:absolute;display:block;border-radius:12px;padding:6px 9px;overflow:hidden;color:var(--fg);min-width:0;z-index:2}
.ev .t{display:block;font-weight:700;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.ev .m{display:block;font-size:12px;color:var(--fg-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.ev.compact{display:flex;align-items:baseline;gap:8px;padding-block:3px}.ev.compact .t{white-space:nowrap;flex:1 1 auto;min-width:0}.ev.compact .m{margin:0;flex:none}.ev.compact .k{flex:none}
.ev.course{background:color-mix(in srgb,var(--c) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.ev.sess{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 28%,transparent) 0 5px,transparent 5px 10px),var(--surface);border:1.5px dashed var(--c)}
.ev.sess.done{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-style:solid;opacity:.8}
.ev.sess.missed{opacity:.55;border-color:var(--muted)}
.ev .k{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}
.ev .k .ic{width:13px;height:13px;stroke-width:2.6}
.ev:hover{filter:brightness(.97)}
.dl-mark{position:absolute;left:0;right:0;z-index:4;border-top:2px dashed var(--c);pointer-events:none}
.dl-mark button{pointer-events:auto;position:absolute;right:6px;top:-13px;display:flex;align-items:center;gap:6px;max-width:80%;padding:3px 10px 3px 8px;border-radius:99px;background:var(--surface);border:1.5px solid var(--c);font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.dl-mark .ic{width:14px;height:14px;color:var(--c);fill:var(--c);flex:none}
.dl-mark span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now-l{position:absolute;left:-5px;right:0;border-top:2px solid var(--now);z-index:5;pointer-events:none}
.now-l::before{content:"";position:absolute;left:0;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.side{position:sticky;top:64px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{font-size:16px;color:var(--brand-ink);margin-bottom:10px}
.mini{display:flex;gap:10px;align-items:center;width:100%;padding:8px 0;border-top:1px solid var(--line)}
.mini:first-of-type{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.mini div{min-width:0;flex:1}.mini b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mini small{color:var(--muted);font-size:12px}
.empty{padding:20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px}

/* Échéances */
.grp{margin-top:20px}
.grp-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.grp-h h2{font-size:18px;color:var(--brand-ink)}.grp-h small{color:var(--muted);font-size:13px}.grp-h.late h2{color:var(--danger)}
.list{display:grid;gap:10px}
@media(min-width:900px){.list{grid-template-columns:1fr 1fr}}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 10px 14px 14px;--c:var(--brand)}
.chk{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--c);display:grid;place-items:center;color:transparent;margin-top:1px;flex:none}
.chk .ic{width:18px;height:18px;stroke-width:3}
.chk:hover{background:color-mix(in srgb,var(--c) 18%,transparent)}
.chk[aria-checked="true"]{background:var(--c);color:#fff}
.dl-b{min-width:0;cursor:pointer}
.dl-t{font-weight:700;font-size:16px;line-height:1.25}
.dl.done .dl-t{text-decoration:line-through;color:var(--muted)}
.dl-m{font-size:13px;color:var(--fg-2);margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 10px;font-variant-numeric:tabular-nums}
.dl-d{margin:6px 0 0;font-size:14px;color:var(--fg-2);overflow-wrap:anywhere}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;border-radius:3px;background:var(--c)}
.warn{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:8px 10px;border-radius:12px;background:var(--danger-soft);color:var(--danger);font-size:13px;font-weight:600}
.warn .ic{width:18px;height:18px;flex:none}
.ses{display:grid;gap:6px;margin-top:12px}
.ses-r{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;background:var(--surface-2);font-size:13px;font-variant-numeric:tabular-nums}
.ses-r span{flex:1;min-width:0}
.ses-r.done span{text-decoration:line-through;color:var(--muted)}
.mini-chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--c);display:grid;place-items:center;color:transparent;flex:none}
.mini-chk .ic{width:15px;height:15px;stroke-width:3}.mini-chk[aria-checked="true"]{background:var(--c);color:#fff}
.del{color:var(--muted)}.del:hover{color:var(--danger);background:var(--danger-soft)}
.del.sure{width:auto;padding:0 10px;font-size:13px;font-weight:700;background:var(--danger);color:#fff}
details.fold{margin-top:24px}
details.fold summary{cursor:pointer;font:700 16px var(--font-display);color:var(--muted);padding:6px 0;list-style:none;display:flex;align-items:center;gap:6px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:"›";display:inline-block;transition:transform .15s}
details.fold[open] summary::before{transform:rotate(90deg)}

/* Feuilles */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(6,18,21,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:540px;max-height:92%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 16px 24px;animation:up .22s ease;box-shadow:var(--shadow)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:24px;padding:24px}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}*{scroll-behavior:auto!important}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.sheet-h h2{font-size:21px;color:var(--brand-ink)}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld>label,.fld>.lb{font-size:13px;font-weight:700;color:var(--fg-2)}
.in{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.in:focus{border-color:var(--brand-ink);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
textarea.in{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--danger);font-size:13px;font-weight:600;margin:-6px 0 12px}
.step{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step output{min-width:84px;text-align:center;font:700 20px var(--font-display);font-variant-numeric:tabular-nums}
.step .sq{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--brand-ink)}
.step .sq:hover{background:var(--brand-soft)}
.pre{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pre button{padding:4px 10px;border-radius:99px;background:var(--surface-2);font-size:13px;font-weight:600}
.pre button:hover{background:var(--brand-soft)}
.sw-c{display:flex;gap:10px;flex-wrap:wrap}
.sw-c button{width:34px;height:34px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 2px var(--surface)}
.sw-c button[aria-checked="true"]{outline:2.5px solid var(--fg);outline-offset:2px}
.sw-c .ic{width:16px;height:16px;stroke-width:3;opacity:0}.sw-c button[aria-checked="true"] .ic{opacity:1}
.preview{background:var(--surface-2);border-radius:16px;padding:12px 14px;margin:4px 0 16px}
.preview h3{font-size:14px;color:var(--brand-ink);margin-bottom:8px}
.preview ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px;font-variant-numeric:tabular-nums}
.preview li{display:flex;justify-content:space-between;gap:8px}
.preview li span:last-child{color:var(--muted)}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* Notifications */
.nt{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 4px;border-top:1px solid var(--line)}
.nt:first-of-type{border-top:0}
.nt .ico{width:38px;height:38px;border-radius:12px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.nt .ico.bad{background:var(--danger-soft);color:var(--danger)}
.nt .ic{width:20px;height:20px}
.nt b{display:block;font-size:14px;line-height:1.3}.nt small{color:var(--muted);font-size:13px}
.nt.unread b::after{content:"";display:inline-block;width:8px;height:8px;margin-left:8px;border-radius:50%;background:var(--now)}
.nt div{min-width:0}

/* Paramètres */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:16px}
.sec h2{font-size:18px;color:var(--brand-ink);margin-bottom:4px}
.sec p{margin:0 0 12px;color:var(--muted);font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--surface-2)}
.seg button{min-height:42px;border-radius:11px;font-weight:700;color:var(--fg-2);text-align:center}
.seg button[aria-checked="true"]{background:var(--brand);color:var(--on-brand)}
.set-r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.set-r:first-of-type{border-top:0}.set-r label{flex:1;min-width:0}.set-r small{display:block;color:var(--muted)}
.set-r .in{width:auto;min-height:40px}
.sw{position:relative;display:inline-block;width:48px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:14px;background:var(--line);transition:background .15s;pointer-events:none}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+span{background:var(--brand)}.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:2px solid var(--brand-ink);outline-offset:2px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.msg{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--brand-soft);color:var(--brand-ink);font-size:14px;font-weight:600}
.msg.bad{background:var(--danger-soft);color:var(--danger)}
.who{display:flex;align-items:center;gap:14px}
.av{width:52px;height:52px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:700 20px var(--font-display);flex:none}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--surface-2);padding:1px 6px;border-radius:6px}

/* Stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:820px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.kpi small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.kpi b{display:block;font:700 28px/1.15 var(--font-display);color:var(--brand-ink);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi em{display:block;font-style:normal;color:var(--muted);font-size:12px;margin-top:2px}
.grid2{display:grid;gap:16px;margin-top:16px}
@media(min-width:900px){.grid2{grid-template-columns:3fr 2fr}}
.chart{overflow-x:auto}
.chart svg{width:100%;height:auto;min-width:320px}

/* ---------- Planificateur ---------- */
const isLocked=(s,nowT)=>s.done||(ts(s.date,s.s)<=nowT&&ts(s.date,s.e)>nowT);
function freeIn(win,busy){
  const out=[];const [a,b]=win;let cur=a;
  for(const [s,e] of busy.filter(x=>x[1]>a&&x[0]<b).sort((x,y)=>x[0]-y[0])){
    if(s>cur)out.push([cur,Math.min(s,b)]);cur=Math.max(cur,e);if(cur>=b)break;}
  if(cur<b)out.push([cur,b]);return out;
}
/* Répartit chaque échéance (la plus proche d'abord) sur les créneaux libres :
   en journée d'abord (hors pause déjeuner), tôt le matin / tard le soir seulement en dernier recours,
   en séances d'environ 1 h étalées jusqu'à la date limite. */
function computePlan(dls,keep,now){
  const nowT=now.getTime(),today=dstr(now),nm=now.getHours()*60+now.getMinutes(),st=S.settings;
  const core=[[st.dayStart+60,st.lunchS],[st.lunchE,st.dayEnd-120]],ext=[[st.dayStart,st.dayStart+60],[st.dayEnd-120,st.dayEnd]];
  const busy={};const B=d=>busy[d]||(busy[d]=[]);
  S.events.forEach(e=>B(e.date).push([e.s-10,e.e+10]));
  keep.forEach(s=>B(s.date).push([s.s-15,s.e+15]));
  const out=[],unplanned={};
  const sorted=[...dls].sort((a,b)=>(a.due+fmtT(a.dueT)).localeCompare(b.due+fmtT(b.dueT)));
  for(const D of sorted){
    if(D.due<today||(D.due===today&&D.dueT<=nm+5))continue;
    let R=D.est-sum(keep.filter(s=>s.dl===D.id&&isLocked(s,nowT)),s=>s.e-s.s);
    if(R<=0)continue;
    const dayList=[];for(let d=today,i=0;d<=D.due&&i<90;d=addD(d,1),i++)dayList.push(d);
    const free=(d,tier)=>{
      const wins=tier==='core'?core:ext;let lo=0,hi=1440;
      if(d===today)lo=Math.ceil((nm+5)/15)*15;if(d===D.due)hi=D.dueT;
      const res=[];
      for(const w of wins){const a=Math.max(w[0],lo),b=Math.min(w[1],hi);if(b-a<15)continue;
        for(const [s,e] of freeIn([a,b],B(d))){const s2=Math.ceil(s/15)*15,e2=Math.floor(e/15)*15;if(e2-s2>=15)res.push([s2,e2]);}}
      return res;};
    const days=dayList.filter(d=>free(d,'core').length||free(d,'ext').length);
    if(!days.length){unplanned[D.id]=R;continue;}
    const place=(d,s,len)=>{out.push({id:uid(),dl:D.id,date:d,s,e:s+len,done:false});B(d).push([s-15,s+len+15]);};
    let unit=60,n=Math.ceil(R/unit);if(n>days.length*2){unit=st.maxSession;n=Math.ceil(R/unit);}
    const base=Math.ceil(R/n/15)*15,parts=[];let rem=R;
    for(let i=0;i<n&&rem>0;i++){const sz=i===n-1?rem:Math.min(rem,base);parts.push(sz);rem-=sz;}
    let left=0;
    parts.forEach((sz,i)=>{
      const t=Math.floor(i*days.length/parts.length),order=[];
      for(let k=0;k<days.length;k++){if(t+k<days.length)order.push(t+k);if(k&&t-k>=0)order.push(t-k);}
      let placed=false;
      for(const tier of ['core','ext']){
        for(const di of order){const d=days[di];const sl=free(d,tier).find(x=>x[1]-x[0]>=sz);if(sl){place(d,sl[0],sz);placed=true;break;}}
        if(placed)break;}
      if(!placed)left+=sz;
    });
    let guard=0;
    while(left>0&&guard++<200){
      let ok=false;
      outer:for(const tier of ['core','ext'])for(const d of days){
        const sl=free(d,tier).find(x=>x[1]-x[0]>=Math.min(30,left));
        if(sl){const take=Math.min(left,sl[1]-sl[0],st.maxSession);place(d,sl[0],take);left-=take;ok=true;break outer;}}
      if(!ok)break;}
    if(left>0)unplanned[D.id]=left;
  }
  return {sessions:out,unplanned};
}
function replan(){
  const now=new Date(),nowT=now.getTime();
  S.sessions=S.sessions.filter(s=>S.deadlines.some(d=>d.id===s.dl));
  const keep=S.sessions.filter(s=>s.done||ts(s.date,s.s)<=nowT);
  const r=computePlan(S.deadlines.filter(d=>!d.done),keep,now);
  S.sessions=keep.concat(r.sessions);S.unplanned=r.unplanned;
}
function previewPlan(cand){
  const now=new Date(),nowT=now.getTime();
  const keep=S.sessions.filter(s=>s.done||ts(s.date,s.s)<=nowT);
  const r=computePlan(S.deadlines.filter(d=>!d.done).concat([cand]),keep,now);
  return {sessions:r.sessions.filter(s=>s.dl===cand.id).sort((a,b)=>(a.date+fmtT(a.s)).localeCompare(b.date+fmtT(b.s))),left:r.unplanned[cand.id]||0};
}
const dueTs=d=>ts(d.due,d.dueT);
const doneMin=d=>sum(S.sessions.filter(s=>s.dl===d.id&&s.done),s=>s.e-s.s);

/* ---------- Import (ICS / CSV) ---------- */
const unesc=s=>(s||'').replace(/\\n/gi,' ').replace(/\\([,;\\])/g,'$1').trim();
function pICSDate(v,params){
  const m=/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)?(Z)?)?$/.exec(v.trim());if(!m)return null;
  if(m[4]===undefined)return {allDay:true};
  const [_,y,mo,d,h,mi,se,z]=m;
  return {date:z?new Date(Date.UTC(+y,mo-1,+d,+h,+mi,+(se||0))):new Date(+y,mo-1,+d,+h,+mi,+(se||0))};
}
function parseICS(text){
  const lines=text.replace(/\r\n?/g,'\n').replace(/\n[ \t]/g,'').split('\n');
  const evs=[];let cur=null;
  for(const ln of lines){
    if(/^BEGIN:VEVENT/i.test(ln)){cur={ex:new Set()};continue;}
    if(/^END:VEVENT/i.test(ln)){if(cur)evs.push(cur);cur=null;continue;}
    if(!cur)continue;const i=ln.indexOf(':');if(i<0)continue;
    const [name,...params]=ln.slice(0,i).split(';');const val=ln.slice(i+1);const N=name.toUpperCase();
    if(N==='SUMMARY')cur.title=unesc(val);else if(N==='LOCATION')cur.loc=unesc(val);
    else if(N==='DTSTART')cur.start=pICSDate(val,params);else if(N==='DTEND')cur.end=pICSDate(val,params);
    else if(N==='RRULE')cur.rrule=val;
    else if(N==='EXDATE')val.split(',').forEach(v=>{const x=pICSDate(v);if(x&&x.date)cur.ex.add(dstr(x.date));});
  }
  const out=[];const t=todayS(),lo=addD(t,-60),hi=addD(t,240);
  for(const e of evs){
    if(!e.start||e.start.allDay||!e.start.date)continue;
    const st=e.start.date,en=(e.end&&e.end.date)||new Date(st.getTime()+36e5),dur=en-st;
    const push=o=>{const ds=dstr(o);if(e.ex.has(ds)||ds<lo||ds>hi)return;const o2=new Date(o.getTime()+dur);
      out.push({id:uid(),title:e.title||'Cours',loc:e.loc||'',date:ds,s:o.getHours()*60+o.getMinutes(),e:dstr(o2)!==ds?1439:o2.getHours()*60+o2.getMinutes(),color:colorFor(e.title||'Cours')});};
    const rule={};(e.rrule||'').split(';').forEach(p=>{const [k,v]=p.split('=');if(k)rule[k.toUpperCase()]=v;});
    const until=rule.UNTIL?(pICSDate(rule.UNTIL)||{}).date:null,count=rule.COUNT?+rule.COUNT:Infinity,inter=+rule.INTERVAL||1;
    const limD=pD(hi);
    if(rule.FREQ==='WEEKLY'){
      const map={MO:0,TU:1,WE:2,TH:3,FR:4,SA:5,SU:6};
      const days=(rule.BYDAY?rule.BYDAY.split(',').map(x=>map[x.slice(-2)]):[(st.getDay()+6)%7]).filter(x=>x!==undefined).sort();
      const m0=pD(monday(dstr(st)));let n=0;
      for(let k=0;k<400;k++){const wk=new Date(m0);wk.setDate(wk.getDate()+7*inter*k);if(wk>limD)break;
        for(const dw of days){const o=new Date(wk);o.setDate(o.getDate()+dw);o.setHours(st.getHours(),st.getMinutes(),0,0);
          if(o<st)continue;if(until&&o>until)break;if(n++>=count)break;push(o);}
        if(n>=count||(until&&wk>until))break;}
    }else if(rule.FREQ==='DAILY'){
      let n=0;for(let k=0;k<400;k++){const o=new Date(st);o.setDate(o.getDate()+k*inter);if(o>limD||(until&&o>until)||n++>=count)break;push(o);}
    }else push(st);
    if(out.length>3000)break;
  }
  return out;
}
function parseCSV(text){
  const rows=text.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());if(rows.length<2)return [];
  const del=(rows[0].match(/;/g)||[]).length>(rows[0].match(/,/g)||[]).length?';':',';
  const split=l=>{const r=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===del&&!q){r.push(c);c='';}else c+=ch;}r.push(c);return r.map(x=>x.trim());};
  const head=split(rows[0]).map(h=>h.toLowerCase());
  const col=re=>head.findIndex(h=>re.test(h));
  const ci={t:col(/titre|mati|cours|title|subject|nom/),d:col(/jour|date|day/),s:col(/d[ée]but|start|de$|d[ée]part/),e:col(/fin|end|^à$|^a$/),l:col(/lieu|salle|loc/)};
  if(ci.t<0||ci.d<0||ci.s<0||ci.e<0)throw new Error('Colonnes attendues : Titre, Jour (ou Date), Début, Fin, Lieu (facultatif).');
  const DOW={lundi:1,mardi:2,mercredi:3,jeudi:4,vendredi:5,samedi:6,dimanche:0,lun:1,mar:2,mer:3,jeu:4,ven:5,sam:6,dim:0};
  const tm=v=>{const m=/(\d{1,2})\s*[:hH]\s*(\d{2})?/.exec(v||'');return m?(+m[1])*60+(+(m[2]||0)):null;};
  const out=[];const t=todayS();
  for(const r of rows.slice(1).map(split)){
    const title=r[ci.t],s=tm(r[ci.s]),e=tm(r[ci.e]);if(!title||s==null||e==null||e<=s)continue;
    const dv=(r[ci.d]||'').toLowerCase().trim();const loc=ci.l>=0?r[ci.l]:'';
    const add=date=>out.push({id:uid(),title,loc,date,s,e,color:colorFor(title)});
    let m;
    if((m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(dv)))add(dv);
    else if((m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(dv)))add(`${m[3]}-${pad(m[2])}-${pad(m[1])}`);
    else if(DOW[dv]!==undefined){for(let i=-14;i<=120;i++){const d=addD(t,i);if(pD(d).getDay()===DOW[dv])add(d);}}
  }
  return out;
}
async function doImport(file){
  try{
    const text=await file.text();
    const ev=/\.csv$/i.test(file.name)||/csv/.test(file.type)?parseCSV(text):parseICS(text);
    if(!ev.length)throw new Error('Aucun cours trouvé dans ce fichier. Vérifie qu’il s’agit d’un export .ics ou .csv.');
    S.events=ev;const ds=ev.map(e=>e.date).sort();
    S.importMeta={source:'fichier',label:file.name,count:ev.length,from:ds[0],to:ds[ds.length-1]};
    replan();save();U.msg={ok:true,t:`${ev.length} cours importés depuis « ${file.name} » (du ${dayShort(ds[0])} au ${dayShort(ds[ds.length-1])}). Les séances de travail ont été replanifiées.`};
  }catch(err){U.msg={ok:false,t:err.message||'Import impossible.'};}
  render();
}

/* ---------- Rappels ---------- */
const rel=ms=>{const m=Math.round(ms/6e4);if(m<60)return `${Math.max(m,1)} min`;const h=Math.round(m/60);if(h<48)return `${h} h`;return `${Math.round(h/24)} j`;};
function notifs(){
  const now=new Date(),nowT=now.getTime(),t=todayS(),out=[];
  for(const d of S.deadlines.filter(x=>!x.done)){
    const diff=dueTs(d)-nowT;
    if(diff<0)out.push({id:'od-'+d.id,ic:'alert',bad:1,t:`En retard : ${d.title}`,s:`Échéance dépassée depuis ${rel(-diff)}`,go:'deadlines'});
    else if(S.settings.remindDue&&diff<48*36e5)out.push({id:'due-'+d.id+(diff<24*36e5?'a':'b'),ic:'flag',t:diff<24*36e5?`Échéance dans ${rel(diff)} : ${d.title}`:`Échéance demain : ${d.title}`,s:`${dayLong(d.due)} à ${fmtT(d.dueT)}`,go:'deadlines'});
  }
  for(const s of S.sessions.filter(x=>x.date===t&&!x.done)){
    const d=dlOf(s.dl);if(!d)continue;const st=ts(s.date,s.s),en=ts(s.date,s.e);
    if(S.settings.remindSession&&st>nowT&&st-nowT<=36e5)out.push({id:'ss-'+s.id,ic:'work',t:`Séance de travail dans ${rel(st-nowT)}`,s:`${d.title} · ${fmtT(s.s)}–${fmtT(s.e)}`,go:'home'});
    else if(st<=nowT&&en>nowT)out.push({id:'now-'+s.id,ic:'work',t:'Séance en cours',s:`${d.title} · jusqu’à ${fmtT(s.e)}`,go:'home'});
    else if(en<=nowT)out.push({id:'miss-'+s.id,ic:'alert',bad:1,t:'Séance manquée, temps replanifié',s:`${d.title} · ${fmtT(s.s)}–${fmtT(s.e)}`,go:'deadlines'});
  }
  for(const e of S.events.filter(x=>x.date===t)){const st=ts(e.date,e.s);
    if(st>nowT&&st-nowT<=36e5)out.push({id:'co-'+e.id,ic:'book',t:`Cours dans ${rel(st-nowT)} : ${e.title}`,s:`${fmtT(e.s)}${e.loc?' · '+e.loc:''}`,go:'home'});}
  for(const [id,m] of Object.entries(S.unplanned||{})){const d=dlOf(id);if(d&&!d.done)out.push({id:'unp-'+id+m,ic:'alert',bad:1,t:`Pas assez de temps libre pour « ${d.title} »`,s:`Il manque ${fmtDur(m)} avant la date limite. Repousse l’échéance ou réduis le temps estimé.`,go:'deadlines'});}
  return out;
}
const unread=()=>notifs().filter(n=>!S.readNotifs.includes(n.id)).length;

/* ---------- Statistiques ---------- */
function weekStats(){
  const ws=monday(todayS()),nowT=Date.now();
  return [0,1,2,3,4,5,6].map(i=>{const date=addD(ws,i);
    return {date,course:sum(S.events.filter(e=>e.date===date),e=>e.e-e.s)/60,
      done:sum(S.sessions.filter(s=>s.date===date&&s.done),s=>s.e-s.s)/60,
      plan:sum(S.sessions.filter(s=>s.date===date&&!s.done&&ts(s.date,s.e)>nowT),s=>s.e-s.s)/60};});
}
function streak(){
  const ds=new Set(S.sessions.filter(s=>s.done).map(s=>s.date));let d=todayS();if(!ds.has(d))d=addD(d,-1);
  let n=0;while(ds.has(d)){n++;d=addD(d,-1);}return n;
}

function toast(t){const r=$('#toast-root');r.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;clearTimeout(toast.h);toast.h=setTimeout(()=>r.innerHTML='',3200);}

/* ---------- Accueil ---------- */
function layoutCols(items){
  items.sort((a,b)=>a.s-b.s||b.e-a.e);const res=[];let cl=[],cEnd=-1;
  const flush=()=>{if(!cl.length)return;const cols=[];cl.forEach(it=>{let c=cols.findIndex(e=>e<=it.s);if(c<0){c=cols.length;cols.push(0);}cols[c]=it.e;it.col=c;});cl.forEach(it=>it.cols=cols.length);res.push(...cl);cl=[];cEnd=-1;};
  items.forEach(it=>{if(cl.length&&it.s>=cEnd)flush();cl.push(it);cEnd=Math.max(cEnd,it.e);});flush();return res;
}
function viewHome(){

  const evs=layoutCols(items).map(it=>{

  const marks=dls.sort((a,b)=>a.dueT-b.dueT).map((d,i)=>`<div class="dl-mark" style="--c:${d.color};top:${px(Math.min(Math.max(d.dueT,T0+10),T1-10))}"><button data-act="goDl" data-id="${d.id}" style="top:${-13+i*28}px">${ic('flag')}<span>Rendu ${fmtT(d.dueT)} · ${esc(d.title)}</span></button></div>`).join('');
  const nowL=sel===today&&nm>=T0&&nm<=T1?`<div class="now-l" id="now-l" style="top:${px(nm)}"></div>`:'';

    return `<button class="dchip ${d===today?'today':''} ${has?'has':''}" data-act="day" data-d="${d}" aria-pressed="${d===sel}" aria-label="${dayLong(d)}"><small>${fmt(pD(d),{weekday:'short'}).replace('.','')}</small><b>${pD(d).getDate()}</b><i></i></button>`;}).join('');
  const up=S.deadlines.filter(d=>!d.done).sort((a,b)=>dueTs(a)-dueTs(b));
  const nxt=up[0];
  const todaySess=S.sessions.filter(s=>s.date===today&&dlOf(s.dl));
  const side=`<aside class="side"><section class="card"><h3>Prochaines échéances</h3>${up.slice(0,5).map(d=>`<button class="mini" style="--c:${d.color}" data-act="goDl" data-id="${d.id}"><i class="dot"></i><div><b>${esc(d.title)}</b><small>${relDue(d)}</small></div></button>`).join('')||'<p class="sub">Rien à rendre. Profites-en !</p>'}
    <button class="btn ghost sm" style="margin-top:10px" data-act="nav" data-v="deadlines">Voir toutes les échéances</button></section>
    <section class="card"><h3>Aujourd’hui</h3><p class="sub" style="margin:0">${sum(todaySess.filter(s=>s.done),s=>s.e-s.s)?fmtDur(sum(todaySess.filter(s=>s.done),s=>s.e-s.s)):'0 min'} de travail fait sur ${fmtDur(sum(todaySess,s=>s.e-s.s))} prévus.</p></section></aside>`;
  return `<div class="wrap"><div class="home-grid"><div style="min-width:0">
    <div class="strip"><button class="icon-btn" data-act="week" data-n="-1" aria-label="Semaine précédente">${ic('left')}</button><div class="days">${strip}</div><button class="icon-btn" data-act="week" data-n="1" aria-label="Semaine suivante">${ic('right')}</button></div>

    <div class="chips"><span class="chip">${dayLong(sel)}</span><span class="chip">${courses.length} cours</span><span class="chip">${sess.length} séance${sess.length>1?'s':''} de travail</span><span class="chip">${dls.length} échéance${dls.length>1?'s':''}</span>${sel!==today?'<button class="chip" data-act="day" data-d="'+today+'" style="background:var(--brand-soft);color:var(--brand-ink)">Revenir à aujourd’hui</button>':''}</div>
    <div class="tl" style="height:calc(${H} * var(--hh))"><div class="tl-h">${hours}</div><div class="tl-g">${lines}${evs}${marks}${nowL}</div></div>
    ${!items.length&&!dls.length?'<p class="empty" style="margin-top:12px">Journée libre. Ajoute une échéance ou importe ton emploi du temps dans les paramètres.</p>':''}
  </div>${side}</div></div>`;
}
function relDue(d){
  const n=diffD(todayS(),d.due),t=dueTs(d)-Date.now();
  if(t<0)return `en retard de ${rel(-t)}`;
  return `${n===0?'aujourd’hui':n===1?'demain':fmt(pD(d.due),{weekday:'long',day:'numeric',month:'short'})} à ${fmtT(d.dueT)}`;
}

/* ---------- Échéances ---------- */
function viewDeadlines(){
  const now=Date.now(),t=todayS();
  const pend=S.deadlines.filter(d=>!d.done).sort((a,b)=>dueTs(a)-dueTs(b)),dn=S.deadlines.filter(d=>d.done).sort((a,b)=>dueTs(b)-dueTs(a));
  const groups=[];
  const late=pend.filter(d=>dueTs(d)<now);if(late.length)groups.push({late:1,label:'En retard',sub:'',items:late});
  pend.filter(d=>dueTs(d)>=now).forEach(d=>{let g=groups.find(x=>x.key===d.due);if(!g){const n=diffD(t,d.due);g={key:d.due,label:n===0?'Aujourd’hui':n===1?'Demain':dayLong(d.due),sub:n<2?dayLong(d.due):'',items:[]};groups.push(g);}g.items.push(d);});
  const card=d=>{
    const dm=doneMin(d),pct=Math.min(100,Math.round(dm/d.est*100)),ss=S.sessions.filter(s=>s.dl===d.id).sort((a,b)=>(a.date+fmtT(a.s)).localeCompare(b.date+fmtT(b.s)));
    const upc=ss.filter(s=>!s.done&&ts(s.date,s.e)>now).length,open=U.exp[d.id],un=(S.unplanned||{})[d.id];
    return `<article class="dl ${d.done?'done':''}" style="--c:${d.color}">
      <button class="chk" role="checkbox" aria-checked="${d.done}" aria-label="Marquer « ${esc(d.title)} » comme ${d.done?'à faire':'faite'}" data-act="toggle" data-id="${d.id}">${ic('check')}</button>
      <div class="dl-b" data-act="expand" data-id="${d.id}"><div class="dl-t">${esc(d.title)}</div>
        <div class="dl-m"><span>avant ${fmtT(d.dueT)}</span><span>${fmtDur(d.est)} estimées</span>${d.done?'':`<span>${upc} séance${upc>1?'s':''} planifiée${upc>1?'s':''}</span>`}</div>
        ${d.desc?`<p class="dl-d">${esc(d.desc)}</p>`:''}
        ${d.done?'':`<div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Avancement"><i style="width:${pct}%"></i></div>`}
        ${un?`<div class="warn">${ic('alert')}<span>Il manque ${fmtDur(un)} de temps libre avant la date limite. Repousse la date ou réduis le temps estimé.</span></div>`:''}
        ${open&&!d.done?`<div class="ses">${ss.filter(s=>ts(s.date,s.e)>now||s.done).map(s=>`<div class="ses-r ${s.done?'done':''}"><span style="white-space:nowrap">${dayShort(s.date)} · ${fmtT(s.s)}–${fmtT(s.e)}</span><button class="mini-chk" role="checkbox" aria-checked="${s.done}" aria-label="Séance faite" data-act="sdone" data-id="${s.id}">${ic('check')}</button></div>`).join('')||'<p class="sub">Aucune séance à venir.</p>'}</div>`:''}
      </div>
      <button class="icon-btn del ${U.delId===d.id?'sure':''}" data-act="del" data-id="${d.id}" aria-label="Supprimer « ${esc(d.title)} »">${U.delId===d.id?'Supprimer ?':ic('trash')}</button></article>`;};
  return `<div class="wrap"><div class="head"><div><h1 class="h1">Échéances</h1><p class="sub">${pend.length} à faire · ${dn.length} faite${dn.length>1?'s':''}</p></div><button class="btn hide-s" data-act="add">${ic('plus')}Nouvelle échéance</button></div>
   ${groups.map(g=>`<section class="grp"><div class="grp-h ${g.late?'late':''}"><h2>${g.label}</h2>${g.sub?`<small>${g.sub}</small>`:''}<small>${g.items.length}</small></div><div class="list">${g.items.map(card).join('')}</div></section>`).join('')||'<p class="empty" style="margin-top:12px">Aucune échéance à venir. Ajoute-en une avec le bouton +.</p>'}
   ${dn.length?`<details class="fold" ${U.exp._done?'open':''}><summary data-act="foldDone">Terminées (${dn.length})</summary><div class="list" style="margin-top:8px">${dn.map(card).join('')}</div></details>`:''}</div>`;

/* ---------- Statistiques ---------- */
function chartWeek(w){
  const W=560,Hh=230,L=38,R=8,Tp=12,Bt=34,pw=W-L-R,ph=Hh-Tp-Bt;
  const mx=Math.max(4,Math.ceil(Math.max(...w.map(d=>d.course+d.done+d.plan))/2)*2),y=v=>Tp+ph-v/mx*ph,bw=pw/7,bar=Math.min(34,bw*.58);
  let g='';for(let v=0;v<=mx;v+=2)g+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v} h</text>`;
  const t=todayS();
  w.forEach((d,i)=>{const x=L+bw*i+(bw-bar)/2;let acc=0;const seg=(v,cls)=>{if(v<=0)return '';const y1=y(acc+v),h=y(acc)-y1-2;acc+=v;return h>0?`<rect class="${cls}" x="${x}" y="${y1}" width="${bar}" height="${h}" rx="4"/>`:'';};
    g+=`<g class="bar-g"><title>${dayLong(d.date)} : cours ${fmtDur(d.course*60)}, travail fait ${fmtDur(d.done*60)}, travail prévu ${fmtDur(d.plan*60)}</title>${seg(d.course,'s-c')}${seg(d.done,'s-d')}${seg(d.plan,'s-p')}<rect x="${L+bw*i}" y="${Tp}" width="${bw}" height="${ph}" fill="transparent"/></g><text x="${x+bar/2}" y="${Hh-12}" text-anchor="middle" class="${d.date===t?'today-l':''}">${fmt(pD(d.date),{weekday:'short'}).replace('.','')} ${pD(d.date).getDate()}</text>`;});
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Heures de cours et de travail par jour cette semaine"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="transparent"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--brand-ink)" stroke-width="2.2" opacity=".75"/></pattern></defs>${g}</svg>`;
}
function viewStats(){
  const t=todayS(),now=Date.now(),w=weekStats();
  const dn=S.deadlines.filter(d=>d.done),late=S.deadlines.filter(d=>!d.done&&dueTs(d)<now);
  const onTime=dn.filter(d=>d.doneAt<=dueTs(d)).length,denom=dn.length+late.length,rate=denom?Math.round(onTime/denom*100):null;

  const busiest=[...load].sort((a,b)=>b.m-a.m)[0],free=load.find((x,i)=>i>0&&x.m===0);

  <div class="kpis">
   <div class="kpi"><small>Rendues à temps</small><b>${rate==null?'–':rate+' %'}</b><em>${onTime} sur ${denom} échéance${denom>1?'s':''}</em></div>
   <div class="kpi"><small>Travail fait (semaine)</small><b>${fmtDur(weekDone*60)}</b><em>${fmtDur(weekPlan*60)} encore prévues</em></div>
   <div class="kpi"><small>Série en cours</small><b>${streak()} jour${streak()>1?'s':''}</b><em>au moins une séance faite par jour</em></div>

    <div class="leg"><span><i style="background:var(--c-course)"></i>Cours</span><span><i style="background:var(--brand-ink)"></i>Travail fait</span><span><i class="p"></i>Travail prévu</span></div>
    <details class="fold" style="margin-top:12px"><summary style="font-size:14px">Voir en tableau</summary><div class="tw"><table class="t"><thead><tr><th>Jour</th><th>Cours</th><th>Fait</th><th>Prévu</th></tr></thead><tbody>${rows}</tbody></table></div></details></section>
   <section class="card"><h3>Avancement des échéances</h3><div class="pg">${pend.map(d=>{const dm=doneMin(d);return `<div class="pg-r" style="--c:${d.color}"><b><span>${esc(d.title)}</span><span>${Math.round(dm/d.est*100)} %</span></b><div class="bar" role="progressbar" aria-valuenow="${Math.round(dm/d.est*100)}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(d.title)}"><i style="width:${Math.min(100,dm/d.est*100)}%"></i></div><small>${fmtDur(dm)} faites sur ${fmtDur(d.est)} · ${relDue(d)}</small></div>`;}).join('')||'<p class="sub">Aucune échéance en cours.</p>'}</div></section></div>
  <div class="grid2"><section class="card"><h3>Charge des 14 prochains jours</h3><div class="heat">${load.slice(0,7).map(heat).join('')}</div><div class="heat" style="margin-top:4px">${load.slice(7).map(heat).join('')}</div><p class="sub" style="margin-top:10px">Plus la case est foncée, plus la journée est remplie (cours et séances de travail).</p></section>
   <section class="card"><h3>À retenir</h3><ul class="ins">
    <li>Journée la plus chargée à venir : <b>${dayLong(busiest.d)}</b> (${fmtDur(busiest.m)}).</li>
    ${free?`<li>Prochaine journée sans cours ni séance : <b>${dayLong(free.d)}</b>.</li>`:''}
    <li>${late.length?`<b>${late.length} échéance${late.length>1?'s':''} en retard.</b> Fais-en une en priorité.`:'Aucune échéance en retard. Continue comme ça.'}</li>
    <li>${rate!=null?`Tu rends ${rate} % de tes échéances à temps.`:'Pas encore assez de données pour calculer ton taux de réussite.'}</li></ul></section></div></div>`;
}
function heat(x){const l=Math.min(90,Math.round(x.m/60/9*90));return `<div style="--l:${l}%" title="${dayLong(x.d)} : ${fmtDur(x.m)}"><small>${fmt(pD(x.d),{weekday:'short'}).replace('.','').slice(0,3)}</small>${pD(x.d).getDate()}</div>`;}

/* ---------- Paramètres ---------- */
function viewSettings(){
  const st=S.settings,th=st.theme;
  const sw=(k,l,sub)=>`<div class="set-r"><label for="s-${k}">${l}<small>${sub}</small></label><span class="sw"><input type="checkbox" id="s-${k}" data-set="${k}" ${st[k]?'checked':''}><span></span></span></div>`;
  const tm=(k,l)=>`<div class="set-r"><label for="s-${k}">${l}</label><input class="in" type="time" id="s-${k}" data-time="${k}" value="${fmtT(st[k])}" step="900"></div>`;
  const im=S.importMeta;
  return `<div class="wrap" style="max-width:720px"><div class="head"><div><h1 class="h1">Compte et paramètres</h1></div></div>
  <section class="sec"><div class="who"><div class="av">${esc((st.name||'É').trim().charAt(0).toUpperCase())}</div><div style="flex:1;min-width:0"><label class="sr" for="s-name">Prénom</label><input class="in" id="s-name" data-name placeholder="Ton prénom" value="${esc(st.name)}" maxlength="30"></div></div></section>
  <section class="sec"><h2>Emploi du temps</h2><p>Importe l’export de ton application (Time Calendar, ADE, Google Agenda…) au format <code>.ics</code>, ou un fichier <code>.csv</code> avec les colonnes Titre, Jour (lundi… ou une date), Début, Fin, Lieu.</p>
    <div class="btns"><label class="btn" for="file-in" tabindex="0" id="imp-l">${ic('up')}Importer mon emploi du temps</label><input type="file" id="file-in" class="sr" accept=".ics,.csv,text/calendar,text/csv"><button class="btn ghost" data-act="sample">Charger l’exemple</button><button class="btn ghost" data-act="clearTT">Vider</button></div><form class="btns" style="margin-top:12px" data-url-form><label class="sr" for="url-in">Lien du calendrier</label><input class="in" id="url-in" type="url" required placeholder="https://…/calendrier.ics" style="flex:1;min-width:200px"><button class="btn ghost" type="submit">Importer le lien</button></form>
    ${U.msg?`<div class="msg ${U.msg.ok?'':'bad'}" role="status">${esc(U.msg.t)}</div>`:''}
    <p style="margin:12px 0 0">Actuellement : <b>${S.events.length?esc(im.label||'Importé')+' · '+S.events.length+' cours':'aucun cours'}</b></p></section>
  <section class="sec"><h2>Apparence</h2><p>Choisis le thème de l’application.</p><div class="seg" role="radiogroup" aria-label="Thème">${[['dark','Sombre'],['light','Clair'],['system','Système']].map(([k,l])=>`<button role="radio" aria-checked="${th===k}" data-act="theme" data-v="${k}">${l}</button>`).join('')}</div></section>
  <section class="sec"><h2>Planification</h2><p>Les séances de travail sont placées en journée, hors pause déjeuner. Tôt le matin et tard le soir ne servent qu’en dernier recours.</p>
    ${tm('dayStart','Début de journée')}${tm('lunchS','Début de pause déjeuner')}${tm('lunchE','Fin de pause déjeuner')}${tm('dayEnd','Fin de journée')}
    <div class="set-r"><label for="s-max">Durée maximale d’une séance</label><select class="in" id="s-max" data-max>${[60,90,120].map(m=>`<option value="${m}" ${st.maxSession===m?'selected':''}>${fmtDur(m)}</option>`).join('')}</select></div></section>
  <section class="sec"><h2>Rappels</h2>${sw('remindSession','Séances et cours','Prévenir une heure avant')}${sw('remindDue','Échéances','Prévenir 48 h avant la date limite')}</section>
  <section class="sec"><h2>Données</h2><p>Les échéances et l’emploi du temps sont enregistrés dans ce navigateur. L’exemple fournit des données fictives pour la démonstration.</p><button class="btn danger" data-act="reset">Réinitialiser avec l’exemple</button></section>
  <p class="sub" style="text-align:center">Timezy - Projet</p></div>`;
}
/* ---------- Feuilles (formulaire, rappels, détail) ---------- */
function openSheet(html){U.sheet=true;$('#sheet-root').innerHTML=`<div class="sheet-bg" data-act="bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Fenêtre">${html}</div></div>`;const f=$('#sheet-root input,#sheet-root textarea,#sheet-root button.sq');}
function closeSheet(){U.sheet=null;U.form=null;$('#sheet-root').innerHTML='';}
const shHead=t=>`<div class="sheet-h"><h2>${t}</h2><button class="icon-btn" data-act="close" aria-label="Fermer">${ic('x')}</button></div>`;

function openForm(){
  const used=S.deadlines.filter(d=>!d.done).map(d=>d.color);
  U.form={id:'preview',title:'',desc:'',est:120,due:addD(todayS(),3),dueT:1080,color:PAL.find(c=>!used.includes(c))||PAL[0],done:false,doneAt:null};
  openSheet(formHtml());refreshPreview();setTimeout(()=>{const i=$('#f-title');i&&i.focus();},30);
}
function formHtml(){
  const f=U.form;
  return `${shHead('Nouvelle échéance')}<form id="dl-form" novalidate>
   <div class="fld"><label for="f-title">Titre</label><input class="in" id="f-title" maxlength="80" placeholder="Ex. Rapport de TP de physique" value="${esc(f.title)}" autocomplete="off"></div>
   <div class="fld"><label for="f-desc">Ce qu’il faut faire</label><textarea class="in" id="f-desc" maxlength="300" placeholder="Détails, consignes, fichiers à rendre…">${esc(f.desc)}</textarea></div>
   <div class="fld"><span class="lb" id="lb-est">Temps estimé pour la réaliser</span><div class="step" role="group" aria-labelledby="lb-est"><button type="button" class="sq" data-act="est" data-n="-15" aria-label="Moins 15 minutes">${ic('minus')}</button><output id="f-est">${fmtDur(f.est)}</output><button type="button" class="sq" data-act="est" data-n="15" aria-label="Plus 15 minutes">${ic('plus')}</button></div>
     <div class="pre">${[30,60,120,240,480].map(m=>`<button type="button" data-act="estSet" data-n="${m}">${fmtDur(m)}</button>`).join('')}</div></div>
   <div class="row2"><div class="fld"><label for="f-due">Date limite</label><input class="in" type="date" id="f-due" min="${todayS()}" value="${f.due}"></div><div class="fld"><label for="f-dueT">Heure limite</label><input class="in" type="time" id="f-dueT" value="${fmtT(f.dueT)}" step="900"></div></div>
   <div class="fld"><span class="lb" id="lb-col">Couleur</span><div class="sw-c" role="radiogroup" aria-labelledby="lb-col">${PAL.map((c,i)=>`<button type="button" role="radio" aria-checked="${f.color===c}" aria-label="${PAL_N[i]}" style="--c:${c}" data-act="color" data-c="${c}">${ic('check')}</button>`).join('')}</div></div>
   <div class="preview" id="f-prev" aria-live="polite"></div><div class="err" id="f-err" role="alert" hidden></div>
   <div class="actions"><button type="button" class="btn ghost" data-act="close">Annuler</button><button type="submit" class="btn">${ic('check')}Ajouter et planifier</button></div></form>`;
}
function refreshPreview(){
  const f=U.form,box=$('#f-prev');if(!box)return;
  if(!f.due||f.due<todayS()||dueTs(f)<=Date.now()){box.innerHTML='<h3>Répartition prévue</h3><p class="sub" style="margin:0">Choisis une date limite à venir pour voir la répartition.</p>';return;}
  const p=previewPlan({...f,title:f.title||'…'});
  box.innerHTML=`<h3>Répartition prévue</h3>${p.sessions.length?`<ul>${p.sessions.map(s=>`<li><span>${dayShort(s.date)}</span><span>${fmtT(s.s)}–${fmtT(s.e)} · ${fmtDur(s.e-s.s)}</span></li>`).join('')}</ul>`:''}${p.left?`<p class="warn" style="margin:8px 0 0">${ic('alert')}<span>${p.sessions.length?`Il manque ${fmtDur(p.left)} de temps libre avant la date limite.`:'Aucun créneau libre avant la date limite.'}</span></p>`:''}`;
}
function submitForm(){
  const f=U.form,err=$('#f-err');
  const bad=m=>{err.textContent=m;err.hidden=false;};
  if(!f.title.trim())return bad('Donne un titre à ton échéance.');
  if(!f.due)return bad('Choisis une date limite.');
  if(dueTs(f)<=Date.now())return bad('La date limite est déjà passée.');
  const d={id:uid(),title:f.title.trim(),desc:f.desc.trim(),est:f.est,due:f.due,dueT:f.dueT,color:f.color,done:false,doneAt:null};
  S.deadlines.push(d);replan();save();closeSheet();
  const n=S.sessions.filter(s=>s.dl===d.id).length,miss=S.unplanned[d.id];
  toast(miss?`Ajoutée, mais il manque ${fmtDur(miss)} de temps libre`:`Échéance ajoutée · ${n} séance${n>1?'s':''} planifiée${n>1?'s':''}`);
  render();
}
function openNotifs(){
  const ns=notifs();
  openSheet(`${shHead('Rappels')}${ns.length?ns.map(n=>`<button class="nt ${S.readNotifs.includes(n.id)?'':'unread'}" data-act="notif" data-id="${esc(n.id)}" data-go="${n.go}"><span class="ico ${n.bad?'bad':''}">${ic(n.ic)}</span><div><b>${esc(n.t)}</b><small>${esc(n.s)}</small></div></button>`).join('')+`<div class="actions" style="margin-top:12px"><button class="btn ghost sm" data-act="readAll">Tout marquer comme lu</button></div>`:'<p class="empty">Aucun rappel pour le moment.</p>'}`);
}
function openDetail(k,id){
  if(k==='c'){const e=S.events.find(x=>x.id===id);if(!e)return;
    openSheet(`${shHead(esc(e.title))}<p class="sub" style="margin:0 0 6px">${dayLong(e.date)}</p><p style="margin:0 0 4px"><b>${fmtT(e.s)}–${fmtT(e.e)}</b> · ${fmtDur(e.e-e.s)}</p>${e.loc?`<p style="margin:0;color:var(--fg-2)">${esc(e.loc)}</p>`:''}<p class="sub">Cours importé depuis ton emploi du temps.</p>`);return;}
  const s=S.sessions.find(x=>x.id===id),d=s&&dlOf(s.dl);if(!d)return;
  openSheet(`${shHead('Séance de travail')}<p style="margin:0 0 4px;font:700 18px var(--font-display)">${esc(d.title)}</p><p class="sub" style="margin:0 0 8px">${dayLong(s.date)} · ${fmtT(s.s)}–${fmtT(s.e)} (${fmtDur(s.e-s.s)})</p>${d.desc?`<p style="color:var(--fg-2)">${esc(d.desc)}</p>`:''}<p class="sub">Rendu ${relDue(d)}.</p>
   <div class="actions"><button class="btn ghost" data-act="goDl" data-id="${d.id}">Voir l’échéance</button><button class="btn" data-act="sdone" data-id="${s.id}" data-close="1">${s.done?'Annuler « faite »':'Marquer comme faite'}</button></div>`);
}

/* ---------- Actions ---------- */
function toggleDone(id){
  const d=dlOf(id),now=Date.now();if(!d)return;
  if(!d.done){d.done=true;d.doneAt=now;
    S.sessions=S.sessions.filter(s=>s.dl!==id||s.done||ts(s.date,s.e)<=now).map(s=>s.dl===id?{...s,done:true}:s);}
  else{d.done=false;d.doneAt=null;}
  replan();save();render();
}
function applyTheme(){const t=S.settings.theme,r=document.documentElement;if(t==='system'){if(U.themeTouched)r.removeAttribute('data-theme');}else r.setAttribute('data-theme',t);}
function go(v){U.view=v;U.scrollPending=true;render();}
function sample(){S.events=sampleCourses();S.importMeta={source:'exemple',label:'Exemple (semaine type, licence informatique)'};replan();save();U.msg={ok:true,t:'Emploi du temps d’exemple chargé.'};render();}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el){if(U.delId){U.delId=null;render();}return;}
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='bg'){if(e.target===el)closeSheet();return;}
  if(a!=='del'&&U.delId){U.delId=null;}
  switch(a){
   case 'nav':closeSheet();go(el.dataset.v);break;
   case 'settings':closeSheet();go('settings');break;
   case 'bell':openNotifs();break;
   case 'close':closeSheet();break;
   case 'add':openForm();break;
   case 'day':U.date=el.dataset.d;U.scrollPending=true;render();break;
   case 'week':U.date=addD(U.date,7*+el.dataset.n);U.scrollPending=true;render();break;
   case 'ev':openDetail(el.dataset.k,id);break;
   case 'goDl':closeSheet();U.exp[id]=true;go('deadlines');setTimeout(()=>{const t=$(`[data-act="toggle"][data-id="${id}"]`);t&&t.closest('.dl').scrollIntoView({block:'center'});},30);break;
   case 'toggle':toggleDone(id);break;
   case 'expand':U.exp[id]=!U.exp[id];render(true);break;
   case 'foldDone':U.exp._done=!U.exp._done;break;
   case 'sdone':{const s=S.sessions.find(x=>x.id===id);if(s){s.done=!s.done;replan();save();}if(el.dataset.close)closeSheet();render(true);break;}
   case 'del':
     if(U.delId===id){S.deadlines=S.deadlines.filter(d=>d.id!==id);S.sessions=S.sessions.filter(s=>s.dl!==id);U.delId=null;replan();save();toast('Échéance supprimée');render(true);}
     else{U.delId=id;render(true);clearTimeout(U.delT);U.delT=setTimeout(()=>{U.delId=null;render(true);},3500);}break;
   case 'est':U.form.est=Math.min(2400,Math.max(15,U.form.est+ +el.dataset.n));$('#f-est').textContent=fmtDur(U.form.est);refreshPreview();break;
   case 'estSet':U.form.est=+el.dataset.n;$('#f-est').textContent=fmtDur(U.form.est);refreshPreview();break;
   case 'color':U.form.color=el.dataset.c;document.querySelectorAll('.sw-c button').forEach(b=>b.setAttribute('aria-checked',b.dataset.c===U.form.color));break;
   case 'notif':if(!S.readNotifs.includes(id)){S.readNotifs.push(id);save();}closeSheet();go(el.dataset.go);break;
   case 'readAll':notifs().forEach(n=>{if(!S.readNotifs.includes(n.id))S.readNotifs.push(n.id);});save();closeSheet();render(true);break;
   case 'theme':S.settings.theme=el.dataset.v;U.themeTouched=true;applyTheme();save();render(true);break;
   case 'sample':sample();break;
   case 'clearTT':S.events=[];S.importMeta={source:'vide',label:''};replan();save();U.msg={ok:true,t:'Emploi du temps vidé.'};render(true);break;
   case 'reset':S=seed();replan();save();U.msg=null;U.themeTouched=false;toast('Données d’exemple rétablies');render();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;if(!U.form)return;
  if(t.id==='f-title')U.form.title=t.value;else if(t.id==='f-desc')U.form.desc=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(U.form){
    if(t.id==='f-due'){U.form.due=t.value;refreshPreview();}
    else if(t.id==='f-dueT'&&t.value){const[h,m]=t.value.split(':').map(Number);U.form.dueT=h*60+m;refreshPreview();}
    return;}
  if(t.id==='file-in'&&t.files[0]){doImport(t.files[0]);t.value='';return;}
  if(t.dataset.set){S.settings[t.dataset.set]=t.checked;save();renderShell();return;}
  if(t.dataset.name!==undefined){S.settings.name=t.value;save();render(true);return;}
  if(t.dataset.max){S.settings.maxSession=+t.value;replan();save();toast('Planning mis à jour');return;}
  if(t.dataset.time&&t.value){
    const old=S.settings[t.dataset.time],[h,m]=t.value.split(':').map(Number);S.settings[t.dataset.time]=h*60+m;
    const s=S.settings;
    if(!(s.dayStart+60<s.lunchS&&s.lunchS<s.lunchE&&s.lunchE<s.dayEnd-120)){S.settings[t.dataset.time]=old;t.value=fmtT(old);toast('Horaires incohérents : la pause doit tenir dans la journée');return;}
    replan();save();toast('Planning mis à jour');}
});
document.addEventListener('submit',e=>{if(e.target.id==='dl-form'){e.preventDefault();submitForm();}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&U.sheet)closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.id==='imp-l'){e.preventDefault();$('#file-in').click();}
});

/* ---------- Rendu & démarrage ---------- */
function render(keepScroll){
  const m=$('#main'),top=m.scrollTop;
  m.innerHTML=U.view==='home'?viewHome():U.view==='deadlines'?viewDeadlines():U.view==='stats'?viewStats():viewSettings();
  $('#fab').innerHTML=fab();renderShell();
  if(U.view==='home'&&U.scrollPending){
    const tl=$('.tl');if(tl){const hh=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hh'))||64;
      const tgt=U.date===todayS()?Math.min(Math.max(nowMin()-120,360),780):450;const first=tl.querySelector('.tl-h span');
      const t0=first?parseInt(first.textContent,10)*60:420;
      m.scrollTop=tl.getBoundingClientRect().top-m.getBoundingClientRect().top+m.scrollTop+(tgt-t0)*hh/60-50;}
    U.scrollPending=false;
  }else if(U.view!==U.lastView){m.scrollTop=0;}else{m.scrollTop=top;}
  U.lastView=U.view;
}
function init(){
  S=load();
  if(!S||S.v!==1)S=seed();
  else if(S.importMeta&&S.importMeta.source==='exemple'&&!S.events.some(e=>e.date>addD(todayS(),14)))S.events=sampleCourses();
  S.readNotifs=S.readNotifs||[];
  applyTheme();replan();save();render();
  let lastMiss=-1;
  setInterval(()=>{
    tickClock();
    const now=Date.now(),miss=S.sessions.filter(s=>!s.done&&ts(s.date,s.e)<=now).length;
    if(lastMiss!==-1&&miss!==lastMiss){replan();save();}
    lastMiss=miss;
    renderShell();
    const nl=$('#now-l');if(nl&&U.view==='home'&&!U.sheet){render(true);}
  },30000);
}
document.addEventListener('submit',async e=>{
  if(!e.target.matches('[data-url-form]'))return;
  e.preventDefault();
  let u=$('#url-in').value.trim().replace(/^webcal:/i,'https:');
  const g=u.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/(?:blob|raw)\/(.+)$/i);
  if(g)u=`https://raw.githubusercontent.com/${g[1]}/${g[2]}/${g[3]}`;
  const tries=[u,
    'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
    'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u),
    'https://corsproxy.io/?url='+encodeURIComponent(u)];
  let t=null;
  for(const x of tries){
    try{
      const r=await fetch(x);if(!r.ok)continue;
      const s=await r.text();
      if(/BEGIN:VCALENDAR/i.test(s)||/\.csv(\?|$)/i.test(u)){t=s;break;}
    }catch(err){}
  }
  if(t==null){U.msg={ok:false,t:'Lien inaccessible. Vérifie l’adresse, ou télécharge le fichier et importe-le directement.'};render(true);return;}
  const csv=/\.csv(\?|$)/i.test(u);
  doImport(new File([t],new URL(u).hostname+(csv?'.csv':'.ics')));
});
init();
})();
</script>

</body></html>
